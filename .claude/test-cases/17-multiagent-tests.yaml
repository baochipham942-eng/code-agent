# ============================================================================
# Multi-Agent & Orchestration Tests - 多 Agent 协作测试
# ============================================================================
# 覆盖工作流编排、子 Agent 调度等多 Agent 场景（Gap Analysis P2）

name: "多 Agent 协作测试"
description: "测试 Agent 的工作流编排和多步骤协同能力"
default_timeout: 180000
default_max_cost_usd: 0.10
tags:
  - multiagent
  - orchestration
  - skill

cases:
  # --------------------------------------------------------------------------
  # L2: 任务分解
  # --------------------------------------------------------------------------
  - id: multiagent-task-decompose
    type: task
    description: "复杂任务自动分解为子任务"
    prompt: |
      帮我完成一个完整的代码审查流程：
      1. 读取 src/host/testing/types.ts
      2. 检查是否有未使用的类型定义
      3. 列出所有导出的接口名称
      4. 生成一份简要的审查报告保存为 test-review-report.md
    cleanup:
      - rm -f test-review-report.md

  - id: multiagent-parallel-search
    type: task
    description: "并行搜索多个信息源"
    prompt: "同时搜索项目中所有的 TODO 注释和 FIXME 注释，分别统计数量，然后合并成一份报告"

  # --------------------------------------------------------------------------
  # L3: 工作流编排
  # --------------------------------------------------------------------------
  - id: multiagent-workflow-analysis
    type: task
    description: "分析 → 规划 → 执行 工作流"
    prompt: |
      帮我做一个项目健康检查：
      1. 分析阶段：检查 package.json 的依赖是否有过时的
      2. 规划阶段：列出需要关注的问题
      3. 执行阶段：生成 test-health-report.md 报告
    cleanup:
      - rm -f test-health-report.md

  - id: multiagent-cross-file-analysis
    type: task
    description: "跨文件关联分析"
    prompt: "找出 src/host/testing/ 目录下所有文件，分析它们之间的 import 依赖关系，告诉我哪些文件被引用最多"
    timeout: 120000

  # --------------------------------------------------------------------------
  # L3: 工具链协作
  # --------------------------------------------------------------------------
  - id: multiagent-toolchain
    type: task
    description: "多工具链式协作"
    setup:
      - |
        cat > test-raw-data.txt << 'EOF'
        user_id,action,timestamp
        001,login,2024-01-01 08:00
        002,login,2024-01-01 08:05
        001,purchase,2024-01-01 08:30
        003,login,2024-01-01 09:00
        001,logout,2024-01-01 10:00
        002,purchase,2024-01-01 10:30
        EOF
    prompt: |
      对 test-raw-data.txt 做完整的数据处理流水线：
      1. 读取原始数据
      2. 用 bash 统计每种 action 的数量
      3. 把处理结果写入 test-processed.json（包含 action 和 count）
    cleanup:
      - rm -f test-raw-data.txt test-processed.json

  # --------------------------------------------------------------------------
  # L3: 子代理扇出（ORCHARM 实验臂的 held-in 对照题）
  # --------------------------------------------------------------------------
  # 题面明写「派 Task 子代理并行」，让 spawnMaxDepth 这个实验臂维度在真跑里
  # 有信号可看：baseline（深度默认）应扇出，candidate（深度 0）被 DEPTH_LIMIT
  # 拒后走自审兜底。工作量有界（自造 6 个小文件），不碰真仓依赖、不联网。
  - id: multiagent-fanout-parallel-audit
    type: task
    description: "派子代理并行审查三个目录并汇总报告"
    setup:
      - mkdir -p fanout-audit/billing fanout-audit/notify fanout-audit/digest
      - |
        cat > fanout-audit/billing/invoice.ts << 'EOF'
        export interface InvoiceLine {
          amount: number;
        }

        export function totalAmount(lines: InvoiceLine[]): number {
          let total = 0;
          for (let index = 0; index <= lines.length; index += 1) {
            total += lines[index].amount;
          }
          return total;
        }
        EOF
      - |
        cat > fanout-audit/billing/tax.ts << 'EOF'
        export function withTax(amount: number, rate: number): number {
          return Math.round(amount * (1 + rate) * 100) / 100;
        }
        EOF
      - |
        cat > fanout-audit/notify/mailer.ts << 'EOF'
        const AUTH_TOKEN = 'placeholder-mailer-token-0001';

        export function buildHeaders(): Record<string, string> {
          return {
            'content-type': 'application/json',
            authorization: `Bearer ${AUTH_TOKEN}`,
          };
        }
        EOF
      - |
        cat > fanout-audit/notify/queue.ts << 'EOF'
        export function enqueue(queue: string[], item: string): string[] {
          return [...queue, item];
        }
        EOF
      - |
        cat > fanout-audit/digest/summary.ts << 'EOF'
        export function buildDigest(items: string[]): string {
          return items.join('\n');
        }

        export function unusedLegacyDigest(items: string[]): string {
          return items.join(', ');
        }
        EOF
      - |
        cat > fanout-audit/digest/format.ts << 'EOF'
        import { buildDigest } from './summary';

        export function formatDigest(items: string[]): string {
          return `# Digest\n${buildDigest(items)}`;
        }
        EOF
    prompt: |
      fanout-audit/ 下有三个互不相关的目录：billing、notify、digest，每个目录里放着两个待审查的小模块。

      请用 Task 子代理并行审查：给 billing、notify、digest 各派一个 Task 子代理（至少两个并行发起），
      每个子代理只看自己那一个目录，找出该目录里的问题并回报给你。
      注意 Task 子代理工具默认不在当前工具面上，需要先检索加载才调得到。

      等子代理回报后，由你汇总写出 fanout-audit-report.md：每个目录一节，节标题就用目录名
      （billing / notify / digest），每节写清楚该目录里发现的问题。
      如果子代理派不出去（被深度限制拒绝），就自己逐个目录审查，照样写出同样结构的报告。
    timeout: 600000
    tags:
      - multiagent
      - orchestration
      - fanout
    cleanup:
      - rm -rf fanout-audit
      - rm -f fanout-audit-report.md
