name: Eval Harness Gate

# 评测基础设施完整性门禁。
# 答案侧不在本仓，CI 只守「没泄露」。
#
# 设计边界（重要）：real-mode eval（--real，真实模型执行）依赖用户本地代理
# （mimo Token Plan 走 token-plan-sgp 海外端点，需 HTTPS_PROXY=127.0.0.1:7897）
# 与本地 SecureStorage key，GitHub runner 环境无法触达，故**不在 PR 上跑真实
# 评测**。本门禁只守确定性的 harness 逻辑：类型检查 + 评测/测试框架单测
# （断言引擎、baseline/trend 来源护栏、judge 校准计算）。agent 真实能力的
# 评测靠内部包的 `npm run eval -- --real`（详见 docs/guides/evaluation-system.md）。
#
# 触发条件：评测基础设施或插件机制相关文件改动时跑，其余 PR 不触发。
# 插件生命周期 job 只跑免费 L4 链路；付费真评测保持本地显式开关。
#
# paths 推导判据：覆盖会影响「插件装入 → 出现在座位 → 打开 → 卸载 → HTTP 边界」
# 的改动：① host 装载、校验与路由；② renderer 的 declareSlot 声明处与每个渲染
# *SlotHost 的宿主文件；③ E2E 自身及它断言的文案 / testid 归属文件。
# 判断口诀：你的文件 import 了 slots/ 或渲染了任一 *SlotHost，或 E2E 断言了你文件里的
# 字符串 / testid ⇒ 必须补进 pull_request.paths 和 push.paths 两处。

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/host/testing/**'
      - 'src/host/internalFeatures/**'
      - 'src/renderer/internalFeatures/**'
      - 'src/renderer/slots/**'
      - 'src/renderer/App.tsx'
      - 'src/renderer/components/features/capabilityHub/CapabilityHubPage.tsx'
      - 'src/renderer/components/features/chat/TurnBasedTraceView.tsx'
      - 'src/renderer/components/features/settings/SettingsModal.tsx'
      - 'src/renderer/components/features/settings/tabs/CapabilityPackageCard.tsx'
      - 'src/renderer/components/features/settings/tabs/PluginsSettings.tsx'
      - 'src/renderer/components/features/settings/tabs/PrivacySettings.tsx'
      - 'src/renderer/components/features/sidebar/SidebarAccountMenu.tsx'
      - 'src/renderer/components/features/sidebar/SidebarCapabilityZone.tsx'
      - 'src/renderer/i18n/capabilityHub.ts'
      - 'src/renderer/i18n/zhSettingsModels.ts'
      - 'src/renderer/utils/settingsTabs.ts'
      - 'src/web/routes/internalFeatures.ts'
      - 'src/host/services/capabilities/manualCapabilityPackageService.ts'
      - 'src/host/plugins/**'
      - 'packages/internal/evaluation-center/**'
      - 'packages/eval-harness/**'
      - '.claude/test-cases/**'
      - 'scripts/ci/check-casebank-answers.mjs'
      - 'tests/scripts/checkCasebankAnswers.test.ts'
      - 'tests/unit/testing/**'
      - 'tests/unit/evaluation/**'
      - 'tests/eval/**'
      - 'tests/eval-harness/**'
      - 'tests/e2e/internal-plugin*'
      - 'tests/renderer/components/secondaryPagesNavigationContract.test.ts'
      - 'tests/renderer/slots/**'
      - 'tests/scripts/pluginGatePaths.test.ts'
      - '.github/workflows/eval-harness-gate.yml'
  push:
    branches: [main]
    paths:
      - 'src/host/testing/**'
      - 'src/host/internalFeatures/**'
      - 'src/renderer/internalFeatures/**'
      - 'src/renderer/slots/**'
      - 'src/renderer/App.tsx'
      - 'src/renderer/components/features/capabilityHub/CapabilityHubPage.tsx'
      - 'src/renderer/components/features/chat/TurnBasedTraceView.tsx'
      - 'src/renderer/components/features/settings/SettingsModal.tsx'
      - 'src/renderer/components/features/settings/tabs/CapabilityPackageCard.tsx'
      - 'src/renderer/components/features/settings/tabs/PluginsSettings.tsx'
      - 'src/renderer/components/features/settings/tabs/PrivacySettings.tsx'
      - 'src/renderer/components/features/sidebar/SidebarAccountMenu.tsx'
      - 'src/renderer/components/features/sidebar/SidebarCapabilityZone.tsx'
      - 'src/renderer/i18n/capabilityHub.ts'
      - 'src/renderer/i18n/zhSettingsModels.ts'
      - 'src/renderer/utils/settingsTabs.ts'
      - 'src/web/routes/internalFeatures.ts'
      - 'src/host/services/capabilities/manualCapabilityPackageService.ts'
      - 'src/host/plugins/**'
      - 'packages/internal/evaluation-center/**'
      - 'packages/eval-harness/**'
      - '.claude/test-cases/**'
      - 'scripts/ci/check-casebank-answers.mjs'
      - 'tests/scripts/checkCasebankAnswers.test.ts'
      - 'tests/unit/testing/**'
      - 'tests/unit/evaluation/**'
      - 'tests/eval/**'
      - 'tests/eval-harness/**'
      - 'tests/e2e/internal-plugin*'
      - 'tests/renderer/components/secondaryPagesNavigationContract.test.ts'
      - 'tests/renderer/slots/**'
      - 'tests/scripts/pluginGatePaths.test.ts'
      - '.github/workflows/eval-harness-gate.yml'
  workflow_dispatch:

concurrency:
  group: eval-harness-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: 评测 harness 完整性（typecheck + 单测）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # 同 swarm-ci：只许 npm ci（无锁 npm install 会重解析整棵树，N-CI-XYFLOW-DEPOPT）
        run: |
          npm ci --ignore-scripts

      - name: Verify better-sqlite3 Node-API binding
        # evaluation 单测（telemetryQueryService 等）走真实 DB；文件缺失或加载失败必须直接红。
        run: |
          test -f node_modules/better-sqlite3/prebuilds/linux-x64.node
          node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('SELECT 1').get(); db.close()"

      - name: Check public case-bank answer leakage
        run: node scripts/ci/check-casebank-answers.mjs

      - name: Typecheck
        run: |
          npm run typecheck
          npm --prefix packages/eval-harness run typecheck
          npm --prefix packages/internal/evaluation-center run typecheck

      - name: Approval decision gate (zero-model)
        # 三桶决策表喂真实 ToolExecutor（dispatch 打桩）：dangerous/injection 零放行、benign 零拒、ask 数走棘轮
        run: npm run eval:approval

      - name: Build evaluation-center plugin
        run: npm --prefix packages/internal/evaluation-center run build

      - name: Guard source evaluation-center manifest
        run: |
          npx vitest run tests/scripts/evaluationCenterSourceManifest.test.ts
          if ! git diff --exit-code -- packages/internal/evaluation-center/plugin.json; then
            echo "::error file=packages/internal/evaluation-center/plugin.json::构建产物泄漏回源码：packages/internal/evaluation-center/plugin.json 被改写；源码只留 unbuilt 占位，真实指纹只进 dist/。恢复命令：git restore -- packages/internal/evaluation-center/plugin.json"
            exit 1
          fi

      - name: Eval harness 单测
        # 断言引擎 + baseline/trend 来源护栏 + judge 校准计算 + replay gate
        # ADR-036 F5a：tests/eval + tests/eval-harness 全 hermetic（40 测试 <0.5s，
        # 无真网/无 API key），纳入门禁堵住"grader/harness 改动无 CI 兜底"的缺口。
        run: npx vitest run tests/unit/testing tests/unit/evaluation tests/eval tests/eval-harness

  internal-plugin-lifecycle:
    name: 插件装/开/卸 + HTTP 负例
    # macOS runner：真插件 stage 走平台沙箱，Linux 的 bubblewrap 在 GitHub runner 上
    # 拿不到用户命名空间（bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted），
    # macOS 的 seatbelt 是系统自带且本机真跑验证过的那条路径。公有仓 runner 免费。
    # 同判例见 .github/workflows/main-full-gate.yml。
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build node-pty native binding
        # --ignore-scripts 会跳过 node-pty 的原生编译；webServer 启动时会同步加载该原生模块。
        run: |
          npm rebuild node-pty --build-from-source
          test -f node_modules/node-pty/build/Release/pty.node

      - name: Verify plugin sandbox runtime
        # 真插件 stage fail-closed 依赖平台沙箱；macOS 走 seatbelt（系统自带 sandbox-exec）。
        run: test -x /usr/bin/sandbox-exec

      - name: Verify system Chrome
        # playwright channel: 'chrome' 要求系统 Chrome；macOS runner 镜像预装。
        run: test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

      - name: Run free internal-plugin lifecycle E2E
        env:
          # Paid real evaluation stays local opt-in; CI must never consume credentials or model budget.
          CODE_AGENT_REAL_EVAL_E2E: '0'
        run: npm run test:e2e:internal-plugin
