name: Long-session Scroll Gate

# Repo-wide PR gate by design: renderer scrolling can regress through shared state, styles,
# dependencies, or build configuration outside src/renderer. Do not add a paths filter.
# Runtime-sensitive performance metrics remain in the JSON/stdout report, while only the
# deterministic anchor/search/streaming-follow correctness checks block PRs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: long-session-scroll-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  correctness:
    name: Long-session scroll correctness
    # Pinned to ubuntu-24.04, not ubuntu-latest: the latest label flipped to the
    # ubuntu-26.04 image (2026-10-18) and Playwright 1.60 ships no ubuntu-26.04
    # chromium build, so `playwright install` fails before any test runs
    # (2026-10-21: every job of this PR's runs died at browser install). Unpin
    # only together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    # A cold Playwright cache can spend most of 10 minutes downloading browser
    # inputs before the correctness test starts. Keep a bounded ceiling, but
    # leave enough room for the actual gate to run on a cold runner.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Install Chromium
        # ubuntu-24.04 already carries the browser system dependencies. Avoid
        # a second apt pass here; the browser install itself stays unconditional.
        uses: ./.github/actions/setup-playwright

      - name: Run deterministic long-session correctness gates
        env:
          E2E_BROWSER_CHANNEL: chromium
          LONG_SESSION_REPORT: ${{ runner.temp }}/long-session-pr-${{ github.sha }}.json
        run: npm run perf:long-session -- --out "$LONG_SESSION_REPORT" --gate-profile correctness

      - name: Protect release evidence from PR runs
        if: always()
        run: git diff --exit-code -- docs/perf/long-session-gold-latest.json

      - name: Upload metrics and correctness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-session-pr-${{ github.run_id }}
          path: ${{ runner.temp }}/long-session-pr-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 14
