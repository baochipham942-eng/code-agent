name: Main Full Gate (post-merge combo check)

# 动机（2026-07-17）：一小时内三处「PR 各自 CI 绿、合入 main 后组合断裂」
# （#427 类型改名×引用、#429 schema 副本失同步、#431 mock 假定失效）。
# PR 门（Swarm CI）只跑分层 smoke/e2e + 局部 typecheck，root 全量
# `npm run typecheck` 与全量 vitest 在合并后从来没人跑——组合断裂只能
# 靠下一个倒霉 PR 或本地全量撞见。
#
# 本 workflow 是**检测型**门：push main 后跑全量 tsc + 全量 vitest，
# 断了立刻红在 main 的 checks 上（不阻塞已完成的合并，但把发现成本
# 从「下个 PR 一轮 CI+靠猜」降到「合后一轮、点名文件」）。
# 预防型（merge queue / ship 本地组合态）另列 P1。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-full-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 失败时开 / 追评 issue —— 见 job 末尾的 "Announce failure" 步骤
  issues: write

jobs:
  full:
    name: Full typecheck + full vitest
    # macOS runner（公有仓免费）：全量套件的绿色档案建立在 darwin 上——
    # bubblewrap 集成测试在 Linux 会真跑、runtime assets/folder-trust inode
    # 语义也随平台漂,首跑 ubuntu 实测 10 个文件环境性红。与开发机同环境
    # 才能让「本地全量绿=门绿」成立。
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # lockfile 生成于 macOS（darwin-arm64 rollup binary 已在 lockfile 内），
        # macOS runner 无需 linux binary 补装。
        run: npm ci --ignore-scripts

      - name: Verify better-sqlite3 Node-API binding
        run: |
          test -f "node_modules/better-sqlite3/prebuilds/darwin-$(node -p 'process.arch').node"
          node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('SELECT 1').get(); db.close()"

      - name: Install Playwright Chromium
        # browser 族测试(mediaAssetLightbox/artifactPreviewHealth/designPreviewRepair/
        # goalCompletionGate 冒烟)依赖内置 Chromium,runner 上缺席会连环红。
        run: npx playwright install chromium

      - name: Full typecheck (root tsc --noEmit)
        # macos-latest runner 7GB,V8 默认老生代堆顶不够本仓 tsc(首跑 Abort trap 6/exit 134 OOM)
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Full vitest
        # --retry=1 与 swarm-ci flake 约定一致，吸收 game/browser 族已知负载抖动。
        run: npx vitest run --retry=1
        env:
          CI: 'true'
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Announce failure (open or update the tracking issue)
        # 2026-07-25 建。这道门是**检测型**的：红了不挡任何合并，也不通知任何人——
        # 实测因此从 #636 起连红 15 个合并没人管。红色 check 挂在 main 上等人路过是不够的，
        # 必须主动出声。同一个 marker 复用一条 issue（连红只追评论，不刷屏开新 issue）。
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: main-full-gate-red
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(printf 'main 全量门失败（这道门不挡合并，需要人来看）。\n\n- commit: `%s`\n- run: %s\n\n修好后请手动关闭本 issue；再次失败会在这里追评论而不是新开。' "${GITHUB_SHA}" "${RUN_URL}")
          EXISTING=$(gh issue list --state open --search "${MARKER} in:title" --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
            echo "commented on existing issue #${EXISTING}"
          else
            gh issue create --title "main 全量门红了（${MARKER}）" --body "${BODY}"
          fi
