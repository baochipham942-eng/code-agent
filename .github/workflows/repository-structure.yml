name: Repository Structure Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/architecture/**'
      - 'src/host/README.md'
      - 'tests/README.md'
      - 'scripts/README.md'
      - 'scripts/*'
      - 'scripts/ci/check-repository-structure.mjs'
      - 'package.json'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/architecture/**'
      - 'src/host/README.md'
      - 'tests/README.md'
      - 'scripts/README.md'
      - 'scripts/*'
      - 'scripts/ci/check-repository-structure.mjs'
      - 'package.json'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-structure:
    name: Repository navigation and growth ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check repository structure
        run: node scripts/ci/check-repository-structure.mjs

      # 报错文案里裸 $VAR 紧跟非 ASCII 字符，在 macOS 自带 bash 3.2 下会被吃进变量名，
      # set -u 触发 "VAR?: unbound variable"，把真正的诊断整条吞掉——只在出错路径上炸，
      # 平时永远发现不了。本机 gates:local 已挂，这里补 PR 门，防止跨会话回归。
      # 脚本零依赖（只用 node: 内置模块），无需 npm install。
      - name: Check shell scripts fail loud
        run: node scripts/shell-fail-loud-lint.mjs
