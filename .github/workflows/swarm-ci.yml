name: Swarm CI (ADR-010 #1)

# ADR-010 #1: Swarm CI 稳定证据
#
# 分层策略：
#   - smoke (<30s):  unit + integration，每个 PR 都跑
#   - full  (~60s):  smoke + Playwright e2e（含 webServer 构建），merge gate
#
# 其他约束：
#   - flake 重试上限 1 次（vitest --retry=1 / playwright retries=1 via CI env）
#   - 失败时上传截图 + Playwright trace / html report
#   - push 到 main 后写回 ci/swarm-health.json（连续通过计数）

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vercel-api/**'
      - 'package.json'
      - 'package-lock.json'
      # tsc 门真读的配置：改窄了 include（= 悄悄缩小门的覆盖面）却一道门都不跑，
      # 是 poppler lock 那个坑的同形状。
      - 'tsconfig.json'
      # tests/scripts tsc 棘轮门真读的配置 + 脚本自身。#452 教训：path 触发盲区会让删除类 PR
      # （改窄 include / 删测试目录）溜过门。
      - 'tsconfig.tests.json'
      - 'scripts/tsc-tests-ratchet.mjs'
      - 'scripts/internal-sdk-hash.ts'
      - 'scripts/ci/agent-event-schema-gate.mjs'
      - 'src/shared/contract/agent.ts'
      - 'src/shared/contract/agentEventSchemas.ts'
      - 'src/shared/contract/generated/agent-events.schema.json'
      - 'scripts/ci/tool-output-schema-ratchet.ts'
      - 'scripts/ci/tool-output-schema-ratchet-baseline.json'
      - 'playwright.config.ts'
      - 'tests/e2e/playwright.e2e.config.ts'
      - '.github/workflows/release.yml'
      - '.github/workflows/renderer-bundle.yml'
      - '.github/workflows/swarm-ci.yml'
      # poppler 发版链：lock 是 release.yml 真读的数据（决定下载哪份 sidecar、按什么哈希验），
      # 改它却一道门都不跑——2026-07-15 lock 翻 ready 的 PR 实测零 checks。
      # 这几条让 popplerReleaseGate/releaseMacosGates 在改动到它们时真跑起来。
      - 'config/poppler-sidecar.lock.json'
      - '.github/workflows/build-poppler-sidecar.yml'
      - '.github/workflows/promote-poppler-sidecar.yml'
      - 'scripts/*poppler*'
      - 'scripts/lib/poppler-sidecar-release.mjs'
      - '.github/workflows/vercel-control-plane.yml'
      - 'scripts/ci/**'
      - 'scripts/console-scan.mjs'
      - 'scripts/a11y-scan.mjs'
      - 'scripts/a11y-axe-ratchet.mjs'
      - 'scripts/a11y-axe-ratchet-baseline.json'
      - 'scripts/stale-dist-scan.mjs'
      - 'scripts/check-design-system.mjs'
      - 'scripts/design-system-baseline.json'
      - 'scripts/design-system-zindex-allowlist.json'
      - 'scripts/check-token-integrity.mjs'
      - 'scripts/check-copy.mjs'
      - 'scripts/host-chinese-error-ratchet.mjs'
      - 'scripts/attention-budget-ratchet.mjs'
      # 基线也要触发：只改基线 = 手工放宽棘轮，不能溜过门（与 knip 基线同理）
      - 'scripts/attention-budget-ratchet-baseline.json'
      - 'scripts/coverage-ratchet.mjs'
      # 覆盖率基线也必须触发：只改基线 = 手工放宽棘轮，不能溜过门
      - 'scripts/coverage-ratchet-baseline.json'
      - 'scripts/ci/host-esm-cjs-lint.mjs'
      - 'tailwind.config.js'
      - 'scripts/knip-ratchet.mjs'
      # 基线本身也要触发这道门：否则「只改基线」的 PR（等于手工放宽棘轮）不会被任何门看到
      - 'scripts/knip-ratchet-baseline.json'
      - 'scripts/knip-production-export-ratchet-baseline.json'
      - 'scripts/knip-production-ratchet-baseline.json'
      - 'scripts/knip-production-ratchet.mjs'
      - 'scripts/eslint-ratchet.mjs'
      - 'knip.json'
      # 依赖维度零容忍门的输入（配置 / 门脚本 / knip 版本单一真源）。
      # package.json 已在上面的清单里——依赖增删本来就该触发这道门。
      - 'knip.dependencies.json'
      - 'scripts/knip-dependency-gate.mjs'
      - 'scripts/lib/knipVersion.mjs'
      - 'knip.production.json'
      - 'knip.production-strict.json'
      - 'scripts/architecture-debt-report.mjs'
      - 'eslint.config.js'
      - 'scripts/build-renderer-bundle.mjs'
      - 'scripts/control-plane-*.mjs'
      - 'scripts/generate-control-plane-env.mjs'
      - 'scripts/renderer-*.mjs'
      - 'scripts/verify-github-workflow-run.mjs'
      - 'scripts/verify-renderer-bundle-publish.mjs'
      - 'scripts/verify-renderer-hot-update-production.mjs'
      - 'scripts/verify-renderer-hot-update-release-gate.mjs'
      - 'scripts/verify-runtime-assets-publish.mjs'
      - 'supabase/migrations/**'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swarm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Smoke: 每个 PR 必跑，目标 <30s
  # ---------------------------------------------------------------------------
  smoke:
    name: Swarm smoke (unit + integration)
    runs-on: ubuntu-latest
    # 15 而非 10：主链路子集 ~200s + 新增的 playwright 浏览器安装 ~1-2min，
    # 原上限对满载 runner 已经偏紧（实测单轮跑到失败就用了 5m25s）。
    # 35 而非 25：主链路子集已涨到 1813 文件 / 1.5w 例、单测步 ~13min，整job在 main 实测
    # 24m17s（2026-09-04 run 33819160133），只剩 43s 余量；PR #1614 连续两轮在 25m1x 被
    # 超时取消（测试本体全绿），25 分钟已实质性撞顶。
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # strict production reachability compares PR additions with the real main merge-base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # 🔴 只许 npm ci。此前第二步 `npm install --no-save --no-package-lock @rollup/…` 是
        # 上古遗留（锁里早已没有 rollup，vite 8 走 rolldown），它唯一的效果是把整棵树在线
        # 重解析（changed 244 packages），锁形同虚设——2026-08-25 @xyflow/react 一发新版全 PR
        # 红（N-CI-XYFLOW-DEPOPT）。锁里 rolldown/esbuild/lightningcss/oxide 的 linux 绑定齐全。
        run: |
          npm ci --ignore-scripts

      - name: Verify better-sqlite3 Node-API binding
        # v13 随包携带 N-API 平台二进制；即使 npm ci --ignore-scripts，也必须真实加载，
        # 防止持久化测试静默退回 in-memory。
        run: |
          test -f node_modules/better-sqlite3/prebuilds/linux-x64.node
          node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('SELECT 1').get(); db.close()"

      - name: Typecheck (tsc — src/ only)
        # CI 此前**没有任何 tsc 门**：smoke/full 跑的 vitest 都是子集，类型错只要不落在子集
        # 覆盖的文件里就能一路溜进 main（2026-07-17 实测：ADR-041 在 main 上留了 2 个 tsc
        # error 没人发现）。全量 vitest 太贵，tsc 只要几十秒——本仓最便宜的一道真门。
        #
        # 这道门只管 `src/**`（tsconfig.json 的 include）。tests/ 和 scripts/ 的类型检查
        # 由下一步 "Typecheck ratchet (tests/ + scripts/)" 单独把关（2026-07-18 建门，基线
        # 1229 存量 error，只降不升）——A-8 那类漏改 scripts 调用方 + 测试侧组合断裂现在被那道
        # 棘轮门抓。（历史坑：tests/e2e/claude-e2e/fixtures/bug-syntax-error 是**故意**写坏的
        # 样例工程，会抛 TS1005 让 tsc 提前中止，tsconfig.tests.json 已在 exclude 里排除它。）
        run: npm run typecheck

      - name: Internal plugin SDK contract hash
        run: npx tsx scripts/internal-sdk-hash.ts --check

      - name: Agent event JSON Schema drift gate
        run: node scripts/ci/agent-event-schema-gate.mjs

      - name: Typecheck ratchet (tests/ + scripts/)
        # 根 typecheck 只管 src/；这道棘轮门补上 tests/ 和 scripts/（一直在 tsc 门外，A-8 那类
        # 漏改 scripts 调用方 + 测试侧组合断裂都从这里溜进过 main）。用 typescript7 引擎跑
        # tsconfig.tests.json，error 数只降不升，基线锁在 scripts/tsc-tests-ratchet.mjs 头注。
        run: node scripts/tsc-tests-ratchet.mjs

      - name: Request replay byte-equivalence gate
        # 无 Key 真跑 E2E 本地模型的一次含工具请求，再从 request_manifest +
        # 账本 + 内容库重建首发拼装视图。消息和工具表任一字节不等即红。
        run: npm run acceptance:request-replay

      - name: Tool output schema ratchet
        # 扫 builtin modules + plugins 的真实 schema exports；0 文件、0 工具、覆盖数回退、
        # 缺 outputSchema 或不受支持的 JSON Schema 都 fail loud。
        run: npm run check:tool-output-schemas

      - name: PTC SDK determinism gate
        # 独立点名确定性合同；脚本先确认测试目标非 0，再运行，避免大子集里路径漂掉后假绿。
        run: npm run check:ptc-sdk-determinism

      - name: PTC transport-name reservation gate
        # Neo 的 PTC 复用 workflow 作为 run_code transport；必须排除自身，防递归占用。
        # 脚本对 0 个目标 fail-loud，不能把「vitest 大子集绿」冒充这道门仍在。
        run: npm run check:ptc-transport-name

      - name: Typecheck Vercel control-plane
        # vercel-api 是独立 package，不属于 root npm workspace；root npm ci 不会装它自己的依赖。
        # 当前 renderer hot-update 的生产门正卡在 control-plane artifact，PR 阶段必须独立编译这层。
        run: |
          npm ci --prefix vercel-api --ignore-scripts
          npm --prefix vercel-api run typecheck

      - name: Static gates (console / a11y / stale-dist / design-system / token-integrity / copy)
        # 六个轻量静态门（纯 node 脚本，无额外依赖，秒级），fast-fail 在跑测试套件之前：
        #   console-scan:          限制裸 console.log/debug 蔓延（基线棘轮 318）
        #   a11y-scan:             轻量可访问性规则（基线棘轮 48）
        #   stale-dist-scan:       禁止构建产物入库
        #   check-design-system:   设计系统棘轮门（此前只有 vitest 版且未进任何 CI 套件，
        #                          bare-button 在 main 上静默漂移 736→758 后接入，基线已如实重置）
        #   check-token-integrity: var(--*) 引用逐主题核对，未定义即红（首跑抓出 DiffView 4 个死 token）
        #   check-copy:            文案棘轮门（营销压力词 13 / 中文串三点省略号 92 只拦新增；
        #                          工程黑话只 warning；注释先剥再匹配，见脚本头注错题本）
        # 均为 hard gate（接入前已确认当前 main 绿、只对"超基线/新增"才红）。
        run: |
          node scripts/console-scan.mjs
          node scripts/a11y-scan.mjs
          node scripts/stale-dist-scan.mjs
          node scripts/check-design-system.mjs
          node scripts/check-token-integrity.mjs
          node scripts/check-copy.mjs

      - name: Host Chinese error literal ratchet
        # P2 工具错误文案分层保护门：只扫描 host/tools + host/memory 的 error 属性，
        # 含中文字符串字面量的存量只降不升。脚本对 0 文件、0 目标和 TS 解析失败 fail loud。
        run: node scripts/host-chinese-error-ratchet.mjs

      - name: Attention budget ratchet (injection fixed cost)
        # 注入固定开销棘轮：无守卫静态注入总量 + 实时语音固定文案 token，只降不升（语音 ±10% 容差见基线）。
        # 此前只在 gates-local 本地跑、CI 零执行——#1199 改语音文案后 CI 全绿合入，把主线门带红（N-L8-ATT11/12）。
        # 脚本对 0 命中文件 / 找不到语音文案锚点 fail-loud，不会扫空假绿。
        run: node scripts/attention-budget-ratchet.mjs

      - name: Coverage baseline direction (no PR coverage run)
        # PR 只做毫秒级的基线方向检查，阻止手工下调；全量 coverage 只在 main-full-gate 跑。
        run: node scripts/coverage-ratchet.mjs --baseline-only --compare-baseline origin/main

      - name: Host ESM/CJS static gate
        # 只扫 host 工具和插件的发行源码；根路径/解析/0 文件都会失败，防止 ESM 构建中
        # 残留裸 require、__dirname 或 module.exports，在惰性工具路径上延迟爆炸。
        run: node scripts/ci/host-esm-cjs-lint.mjs

      - name: Visual shotbase baseline sync gate
        # 截图前契约变了，light/dark 两张 Linux PNG 必须同步重录；
        # 同时拒绝本机 -darwin 产物冒充 Swarm full 的 Linux/Chromium 基线。
        run: npm run check:visual-shotbase-baselines

      - name: Script gates (vitest tests/scripts)
        # tests/scripts 下的守门测试（designSystemGate / architectureDebtReport /
        # windowChromeContract / releaseMacosGates 等）此前不在任何 CI 套件里，
        # god-file 债务在 main 上红了都没人知道（2026-07-02 抓到 4 文件超线）。整套接入。
        run: node scripts/ci/vitest-with-flake-ledger.mjs --job "Script gates (vitest tests/scripts)" -- npx vitest run tests/scripts --retry=1

      - name: Read Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-v2

      - name: Install Playwright browsers
        # 主链路子集里有真跑交互 smoke 的用例（gameArtifactValidator 等，走 playwright
        # 启浏览器）。本 job 此前不装浏览器，全靠 runner 镜像里碰巧有匹配版本的缓存——
        # 实测 #666 绿而 #665 连挂两次，失败信息是 browserType.launch: Executable
        # doesn't exist at ~/.cache/ms-playwright/chromium_headless_shell-<build>。
        # 即这道门当时是抽奖：跑不起浏览器时 runtimeChecks 为空，断言"有 runtime 证据"
        # 反而落空，红得跟被测代码毫无关系。与本 workflow 的 full job / main-full-gate
        # 🔴 无条件装（浏览器已在时是空操作）。08-25 实付：此前「缓存命中就跳过」，而缓存是
        # 无锁重解析时代按错版本 playwright-core 填的，键却写着锁里的 1.60.0 ⇒ 命中即缺
        # chromium_headless_shell。键加 -v2 甩掉毒缓存（N-CI-XYFLOW-DEPOPT）。
        run: npx playwright install --with-deps chromium


      - name: MCP protocol compatibility (unit + integration)
        run: node scripts/ci/vitest-with-flake-ledger.mjs --job "MCP protocol compatibility" -- npx vitest run tests/unit/mcp tests/integration/mcp --retry=1

      - name: Knip dead-export ratchet
        # dead exports+types 集合棘轮（基线见 scripts/knip-ratchet-baseline.json）。
        # knip 版本锁在脚本内（npx knip@<pin>），未入 devDependencies；本地实测 ~12s，
        # CI 走 setup-node 的 npm 缓存。独立 step 便于失败归因。
        run: node scripts/knip-ratchet.mjs

      - name: Knip production dead-export ratchet
        # 只用发行版入口的 strict profile 查 export/type；测试消费不再把生产死导出
        # 算作可达。独立 step 保留与普通 dead-export 门各自的失败归因。
        run: node scripts/knip-ratchet.mjs --profile production

      - name: Knip production-reachability ratchet
        # legacy profile 锁存量文件集合；strict profile 关闭自动测试/plugin 入口，只拦相对 main
        # 新增且从发行版入口完全走不到的源码。完整历史用于解析真实 merge-base。
        run: node scripts/knip-production-ratchet.mjs

      - name: Knip dependency dimension gate
        # 依赖维度**零容忍**（不是棘轮）：unlisted / unused / unresolved 必须为 0。
        # knip.json 的 `ignoreDependencies: [".*"]` 把依赖维度整个关掉了，这道门补上。
        # 未声明依赖靠 transitive hoisting 活着，上游一变就是运行时 MODULE_NOT_FOUND，
        # 且只在打包后的 app 里炸——开发树永远有它，本地跑不出来。
        run: node scripts/knip-dependency-gate.mjs

      - name: ESLint error/warning ratchet
        # errors / warnings 双独立基线棘轮；任一超基线即阻塞，清理后只能下调。
        run: node scripts/eslint-ratchet.mjs

      - name: Architecture effective-line gate
        # 只阻断非 God File 历史白名单的 effective 超限文件；报告里的 ESLint 热点在 CI 不重复扫。
        run: node scripts/architecture-debt-report.mjs --gate --skip-eslint

      - name: Run swarm smoke suite
        run: node scripts/ci/vitest-with-flake-ledger.mjs --job "Run swarm smoke suite" -- npm run test:swarm:smoke -- --retry=1

      - name: Upload smoke failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-smoke-logs-${{ github.run_id }}
          path: |
            coverage/
            ${{ runner.temp }}/vitest-report*.json
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Full: merge gate，smoke + Playwright e2e（含 webServer 构建）
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Unit: 全部 unit + renderer，4 路分片并行
  #
  # 2026-09-05 从 smoke job 里拆出来。动机是实测账：smoke job 一轮 1134s，其中这一步
  # 独占 782s（69%），整条 PR 门 wall clock 22min 大半卡在它一个人身上，且它跟前面
  # 三十道静态门之间没有任何依赖关系，纯粹是被串在同一个 job 里。
  #
  # vitest 原生 --shard 按测试文件均分，shard 只切分不筛选。扩围后的耗时以 CI 实测为准。
  # 分片数改了必须同步 --shard=N/M 的分母与步骤名，tests/scripts 会校验分母一致性。
  # fail-fast: false —— 一个分片红不能取消其他分片，否则只看得到第一个失败面。
  # ---------------------------------------------------------------------------
  unit:
    name: Unit + renderer vitest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # 同 smoke job：只许 npm ci（理由见 smoke job 同名步骤）
        run: npm ci --ignore-scripts

      - name: Verify better-sqlite3 Node-API binding
        # v13 随包携带 N-API 平台二进制；即使 npm ci --ignore-scripts，也必须真实加载，
        # 防止持久化测试静默退回 in-memory。
        run: |
          test -f node_modules/better-sqlite3/prebuilds/linux-x64.node
          node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('SELECT 1').get(); db.close()"

      - name: Read Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-v2

      - name: Install Playwright browsers
        # 子集里有真跑交互 smoke 的用例（gameArtifactValidator 等，走 playwright 启浏览器）。
        # 🔴 无条件装（浏览器已在时是空操作）——缓存命中就跳过曾在 08-25 实付：缓存是无锁重
        # 解析时代按错版本 playwright-core 填的，键却写着锁里的版本 ⇒ 命中即缺 headless shell。
        run: npx playwright install --with-deps chromium

      - name: Unit + renderer vitest (shard ${{ matrix.shard }}/4)
        # 2026-09-05 N-GATE-SUBSET-EXPAND：全收 tests/unit + tests/renderer。
        # main-full-gate 是合入后检测门，红了不挡合并（#668）；不能让未点名目录继续漏门。
        # Vitest 位置参数是路径子串，tests/unit 会递归包含根级及所有子目录。
        # ROOT_UNIT_TESTS 的 glob 展开及空展开自检因此移除：已没有可能空展开的 glob；
        # tests/scripts 的目标合同要求两个整目录参数，防退回点名子集；Vitest 零目标默认报错。
        #
        # 平台性排除（保留既有两条，逐文件）：
        # - webSearch.test.ts：PR #691 Ubuntu 真跑 `401 Unauthorized: invalid API key`，需要真 key。
        # - goalVerifyGate.test.ts：Ubuntu dash 输出 `not found`，断言要求 `command not found`。
        # PR #691 曾误排整个 modules/network，摘掉后 12 文件仅 webSearch 一条挂；
        # 排除必须绑定实测失败文件，不能用平台理由整目录一刀切。
        run: |
          node scripts/ci/vitest-with-flake-ledger.mjs --job "Unit + renderer vitest shard ${{ matrix.shard }}" -- npx vitest run tests/unit tests/renderer \
            --shard=${{ matrix.shard }}/4 --retry=1 \
            --exclude 'tests/unit/tools/modules/network/webSearch.test.ts' \
            --exclude 'tests/unit/agent/goalVerifyGate.test.ts'

  full:
    name: Swarm full (smoke + e2e)
    # full/e2e 现在 PR 也跑（删掉了原来限定 push/workflow_dispatch 的 if）：merge gate 只在合并后
    # 才跑会造成"PR 绿、main 红"——只在 full 暴露的基建缺陷（如 e2e webServer 的原生模块缺失）在
    # PR 阶段测不到，合进 main 必红（见 #166）。on.pull_request.paths 已把触发限定在 src/** /
    # tests/** 等代码 PR，docs-only PR 不会触发整条 workflow，CI 成本可控；workflow_dispatch 仍可
    # 手动跑。
    #
    # 2026-09-05 去掉 `needs: smoke`：full 不复用 smoke 的任何产物（自己 checkout、自己
    # npm ci、自己再跑一遍 smoke suite），串在后面只是把它那 3min 加在 smoke 的 19min 后面。
    # 代价是 smoke 注定要红的 PR 也会白跑一轮 e2e——公有仓 runner 免费，换 3min wall clock 值。
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # 同 smoke job：只许 npm ci（见上）
        run: |
          npm ci --ignore-scripts

      - name: Verify better-sqlite3 Node-API binding
        # v13 的 linux-x64 N-API 二进制在 npm 包内；文件缺失或真实加载失败都直接终止。
        run: |
          test -f node_modules/better-sqlite3/prebuilds/linux-x64.node
          node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('SELECT 1').get(); db.close()"

      - name: Build node-pty native binding
        # main 的 full job 一直缺这步：npm ci --ignore-scripts 跳过了 node-pty 的 install 脚本，
        # 而 node-pty 1.1.0 只带 darwin / win32 prebuild、不带 linux-x64，e2e webServer 启动时
        # loadNativeModule('pty') 在 build/Release → prebuilds/linux-x64 都找不到 pty.node 直接崩
        # （exit 1），导致每次 push main 的 full job 必红（PR 只跑 smoke 不起 webServer 所以看不出）。
        # 这里现场编译并断言产物存在，让失败暴露在本步而非拖到 webServer 启动。
        run: |
          npm rebuild node-pty --build-from-source
          test -f node_modules/node-pty/build/Release/pty.node

      - name: Read Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-v2

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: node scripts/ci/vitest-with-flake-ledger.mjs --job "Run smoke suite" -- npm run test:swarm:smoke -- --retry=1

      # e2e 从只跑 swarm-chain 扩到三条（+ design-canvas + workbench-overview）：
      # 手动 spec 没有运行者必然腐烂——design-canvas 那条引用的 testid 和按钮标签在 main 上
      # 早就不存在了，没人知道。三条共用同一次 playwright 调用，webServer 只起一次，
      # 边际成本就是两条 spec 自己跑的那点时间，不再多付一遍构建。
      - name: Run swarm e2e suite
        env:
          CODE_AGENT_E2E: '1'
          CI: '1'
        run: npm run test:swarm:e2e

      # 规则类型初值与计数参考来自本 PR 的 Swarm full Linux/Chromium
      # record artifact（run 33397733582）。新增规则类型 fail；已有规则的 DOM 节点计数
      # 会随 teardown 扫描时的运行态波动，只进 step summary 和 artifact，不再卡 merge。
      - name: Check axe runtime accessibility ratchet
        if: always()
        run: |
          # full job 的 checkout 是 PR merge 浅克隆，本地没有 origin/main 引用，
          # 显式抓 main 顶端供基线对照（只读基线文件，depth=1 足够）。
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          node scripts/a11y-axe-ratchet.mjs --compare-baseline origin/main

      - name: Upload axe runtime accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-e2e-axe-${{ github.run_id }}
          path: test-results/axe/axe-report.json
          if-no-files-found: error
          retention-days: 14

      # record 阶段由本 job 的 Ubuntu/Chromium 生成，回填仓库后每轮继续上传同一批文件，
      # 让平台来源与实际参与比较的 expected PNG 都可审计。
      - name: Upload visual screenshot baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-e2e-visual-baselines-${{ github.run_id }}
          path: tests/e2e/**/*-snapshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Record result (success)
        if: success()
        id: result
        run: echo "status=pass" >> "$GITHUB_OUTPUT"

      - name: Record result (failure)
        if: failure()
        id: result_fail
        run: echo "status=fail" >> "$GITHUB_OUTPUT"

      - name: Upload Playwright trace + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-e2e-trace-${{ github.run_id }}
          # Playwright 默认把 -actual / -expected / -diff 三件套写进 test-results/。
          path: |
            playwright-report/
            test-results/
            test-results/axe/axe-report.json
            tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # 不再写回 ci/swarm-health.json：streak 直接从 GitHub Actions API 派生，
  # 用 scripts/ci/swarm-streak.sh 按需查询，避免 [skip ci] commit + 1-commit
  # lag 的 trade-off。详见 docs/decisions/010-swarm-road-to-10.md #1。
