name: Swarm CI (ADR-010 #1)

# ADR-010 #1: Swarm CI 稳定证据
#
# 分层策略：
#   - smoke (<30s):  unit + integration，每个 PR 都跑
#   - full  (~60s):  smoke + Playwright e2e（含 webServer 构建），merge gate
#
# 其他约束：
#   - flake 重试上限 1 次（vitest --retry=1 / playwright retries=1 via CI env）
#   - 失败时上传截图 + Playwright trace / html report
#   - push 到 main 后写回 ci/swarm-health.json（连续通过计数）

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vercel-api/**'
      - 'package.json'
      - 'package-lock.json'
      # tsc 门真读的配置：改窄了 include（= 悄悄缩小门的覆盖面）却一道门都不跑，
      # 是 poppler lock 那个坑的同形状。
      - 'tsconfig.json'
      # tests/scripts tsc 棘轮门真读的配置 + 脚本自身。#452 教训：path 触发盲区会让删除类 PR
      # （改窄 include / 删测试目录）溜过门。
      - 'tsconfig.tests.json'
      - 'scripts/tsc-tests-ratchet.mjs'
      - 'playwright.config.ts'
      - 'tests/e2e/playwright.e2e.config.ts'
      - '.github/workflows/release.yml'
      - '.github/workflows/renderer-bundle.yml'
      - '.github/workflows/swarm-ci.yml'
      # poppler 发版链：lock 是 release.yml 真读的数据（决定下载哪份 sidecar、按什么哈希验），
      # 改它却一道门都不跑——2026-07-15 lock 翻 ready 的 PR 实测零 checks。
      # 这几条让 popplerReleaseGate/releaseMacosGates 在改动到它们时真跑起来。
      - 'config/poppler-sidecar.lock.json'
      - '.github/workflows/build-poppler-sidecar.yml'
      - '.github/workflows/promote-poppler-sidecar.yml'
      - 'scripts/*poppler*'
      - 'scripts/lib/poppler-sidecar-release.mjs'
      - '.github/workflows/vercel-control-plane.yml'
      - 'scripts/ci/**'
      - 'scripts/console-scan.mjs'
      - 'scripts/a11y-scan.mjs'
      - 'scripts/stale-dist-scan.mjs'
      - 'scripts/check-design-system.mjs'
      - 'scripts/design-system-baseline.json'
      - 'scripts/design-system-zindex-allowlist.json'
      - 'scripts/check-token-integrity.mjs'
      - 'scripts/check-copy.mjs'
      - 'scripts/host-chinese-error-ratchet.mjs'
      - 'tailwind.config.js'
      - 'scripts/knip-ratchet.mjs'
      # 基线本身也要触发这道门：否则「只改基线」的 PR（等于手工放宽棘轮）不会被任何门看到
      - 'scripts/knip-ratchet-baseline.json'
      - 'scripts/knip-production-ratchet.mjs'
      - 'scripts/eslint-ratchet.mjs'
      - 'knip.json'
      - 'knip.production.json'
      - 'knip.production-strict.json'
      - 'scripts/architecture-debt-report.mjs'
      - 'eslint.config.js'
      - 'scripts/build-renderer-bundle.mjs'
      - 'scripts/control-plane-*.mjs'
      - 'scripts/generate-control-plane-env.mjs'
      - 'scripts/renderer-*.mjs'
      - 'scripts/verify-github-workflow-run.mjs'
      - 'scripts/verify-renderer-bundle-publish.mjs'
      - 'scripts/verify-renderer-hot-update-production.mjs'
      - 'scripts/verify-renderer-hot-update-release-gate.mjs'
      - 'scripts/verify-runtime-assets-publish.mjs'
      - 'supabase/migrations/**'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swarm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Smoke: 每个 PR 必跑，目标 <30s
  # ---------------------------------------------------------------------------
  smoke:
    name: Swarm smoke (unit + integration)
    runs-on: ubuntu-latest
    # 15 而非 10：主链路子集 ~200s + 新增的 playwright 浏览器安装 ~1-2min，
    # 原上限对满载 runner 已经偏紧（实测单轮跑到失败就用了 5m25s）。
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # strict production reachability compares PR additions with the real main merge-base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # npm bug #4828：lockfile 在 macOS 上生成，只记录了 darwin-arm64 的 rollup
        # native binary。先 npm ci 用 lockfile 装其他依赖，再单独装缺失的 linux
        # platform binary。--no-save --no-package-lock 确保 lockfile 不被改。
        run: |
          npm ci --ignore-scripts
          npm install --no-save --no-package-lock --ignore-scripts @rollup/rollup-linux-x64-gnu

      - name: Verify better-sqlite3 Node-API binding
        # v13 随包携带 N-API 平台二进制；即使 npm ci --ignore-scripts，也必须真实加载，
        # 防止持久化测试静默退回 in-memory。
        run: |
          test -f node_modules/better-sqlite3/prebuilds/linux-x64.node
          node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('SELECT 1').get(); db.close()"

      - name: Typecheck (tsc — src/ only)
        # CI 此前**没有任何 tsc 门**：smoke/full 跑的 vitest 都是子集，类型错只要不落在子集
        # 覆盖的文件里就能一路溜进 main（2026-07-17 实测：ADR-041 在 main 上留了 2 个 tsc
        # error 没人发现）。全量 vitest 太贵，tsc 只要几十秒——本仓最便宜的一道真门。
        #
        # 这道门只管 `src/**`（tsconfig.json 的 include）。tests/ 和 scripts/ 的类型检查
        # 由下一步 "Typecheck ratchet (tests/ + scripts/)" 单独把关（2026-07-18 建门，基线
        # 1229 存量 error，只降不升）——A-8 那类漏改 scripts 调用方 + 测试侧组合断裂现在被那道
        # 棘轮门抓。（历史坑：tests/e2e/claude-e2e/fixtures/bug-syntax-error 是**故意**写坏的
        # 样例工程，会抛 TS1005 让 tsc 提前中止，tsconfig.tests.json 已在 exclude 里排除它。）
        run: npm run typecheck

      - name: Typecheck ratchet (tests/ + scripts/)
        # 根 typecheck 只管 src/；这道棘轮门补上 tests/ 和 scripts/（一直在 tsc 门外，A-8 那类
        # 漏改 scripts 调用方 + 测试侧组合断裂都从这里溜进过 main）。用 typescript7 引擎跑
        # tsconfig.tests.json，error 数只降不升，基线锁在 scripts/tsc-tests-ratchet.mjs 头注。
        run: node scripts/tsc-tests-ratchet.mjs

      - name: Typecheck Vercel control-plane
        # vercel-api 是独立 package，不属于 root npm workspace；root npm ci 不会装它自己的依赖。
        # 当前 renderer hot-update 的生产门正卡在 control-plane artifact，PR 阶段必须独立编译这层。
        run: |
          npm ci --prefix vercel-api --ignore-scripts
          npm --prefix vercel-api run typecheck

      - name: Static gates (console / a11y / stale-dist / design-system / token-integrity / copy)
        # 六个轻量静态门（纯 node 脚本，无额外依赖，秒级），fast-fail 在跑测试套件之前：
        #   console-scan:          限制裸 console.log/debug 蔓延（基线棘轮 318）
        #   a11y-scan:             轻量可访问性规则（基线棘轮 48）
        #   stale-dist-scan:       禁止构建产物入库
        #   check-design-system:   设计系统棘轮门（此前只有 vitest 版且未进任何 CI 套件，
        #                          bare-button 在 main 上静默漂移 736→758 后接入，基线已如实重置）
        #   check-token-integrity: var(--*) 引用逐主题核对，未定义即红（首跑抓出 DiffView 4 个死 token）
        #   check-copy:            文案棘轮门（营销压力词 13 / 中文串三点省略号 92 只拦新增；
        #                          工程黑话只 warning；注释先剥再匹配，见脚本头注错题本）
        # 均为 hard gate（接入前已确认当前 main 绿、只对"超基线/新增"才红）。
        run: |
          node scripts/console-scan.mjs
          node scripts/a11y-scan.mjs
          node scripts/stale-dist-scan.mjs
          node scripts/check-design-system.mjs
          node scripts/check-token-integrity.mjs
          node scripts/check-copy.mjs

      - name: Host Chinese error literal ratchet
        # P2 工具错误文案分层保护门：只扫描 host/tools + host/memory 的 error 属性，
        # 含中文字符串字面量的存量只降不升。脚本对 0 文件、0 目标和 TS 解析失败 fail loud。
        run: node scripts/host-chinese-error-ratchet.mjs

      - name: Script gates (vitest tests/scripts)
        # tests/scripts 下的守门测试（designSystemGate / architectureDebtReport /
        # windowChromeContract / releaseMacosGates 等）此前不在任何 CI 套件里，
        # god-file 债务在 main 上红了都没人知道（2026-07-02 抓到 4 文件超线）。整套接入。
        run: npx vitest run tests/scripts --retry=1

      - name: Install Playwright browsers
        # 主链路子集里有真跑交互 smoke 的用例（gameArtifactValidator 等，走 playwright
        # 启浏览器）。本 job 此前不装浏览器，全靠 runner 镜像里碰巧有匹配版本的缓存——
        # 实测 #666 绿而 #665 连挂两次，失败信息是 browserType.launch: Executable
        # doesn't exist at ~/.cache/ms-playwright/chromium_headless_shell-<build>。
        # 即这道门当时是抽奖：跑不起浏览器时 runtimeChecks 为空，断言"有 runtime 证据"
        # 反而落空，红得跟被测代码毫无关系。与本 workflow 的 full job / main-full-gate
        # 保持同一手法，显式装。
        run: npx playwright install --with-deps chromium

      - name: Main-chain vitest subset (agent / tools / ipc / services / design / renderer)
        # 2026-07-25 建门。动机：全量 vitest 只在 push main 后的检测门里跑，PR 阶段完全
        # 看不见——`main-full-gate` 因此从 #636 起连红 15 个合并没人管（5 套件：partial
        # vi.mock 一加新导出就断 ×3、权限链上新增 DB 读未加守卫 ×1、人话改造后断言过期 ×1）。
        #
        # 这一步把**主链路**（agent 运行时 / 工具执行 / IPC / host services）纳入 PR 门：
        # 618 文件 5892 用例，本机 ~186s。
        #
        # 2026-07-25 第三轮扩围：**tests/renderer 纳入**。原本的覆盖边界（"renderer 与其余
        # 长尾留给检测门兜底"）在建门当天就被连撞三次——#663 手搓主操作色撞 primaryAction
        # 棘轮、#671 ExpertPanel 因 useMcpStatus 订阅 MCP_EVENT 而 mock 缺 on 直接崩、
        # #681 文案迁 i18n 后 mainTaskModelCopy 断言仍查源码字面量。三次 PR 门都是绿的，
        # 三次都把 main 弄红，靠 push 后的检测门事后发现。
        # 成本实测（本机 darwin）：tests/renderer 468 文件 2954 用例 89.9s，同机主链路子集
        # 187.9s、CI 上 199s（比例 1.06）→ 推算 CI 上约 +95s。本 job 原 7m44s → 约 9m20s，
        # 注：此处余量数字是 2026-07 写的，与 08-06 观测（13.5min/15min）不符，没人在盯真实时长。
        # 2026-08-07 起 timeout 抬到 25min，先解除假红压力，真实时长另行观测。
        # 其余长尾（tests/scripts 之外的 unit 子目录、security、integration 等）仍留给
        # 检测门兜底——这依然是明说的覆盖边界，不是以为跑全了。
        #
        # 三处 exclude 是**平台性**排除，不是给业务代码开豁免。本 job 跑 ubuntu，而全量套件的
        # 绿色档案建立在 darwin（见 main-full-gate.yml 的 runs-on 注释：首跑 ubuntu 实测 10 个
        # 文件环境性红）。首跑本步实测正是这三类落在子集里（4 文件）：
        #   webSearch.test.ts             需要真 API key
        #   goalVerifyGate.test.ts        断言 shell 文案 'command not found'，dash 说的是 'not found'
        # 两者的业务覆盖没有丢，仍由 macos 上的 main-full-gate 全量门看着。
        #
        # 2026-07-25 第二轮试摘（真 CI 验证，PR #691）：原本排的是整个 modules/network/**，
        # 理由写「需要真 API key，无 key 时 401」。真摘掉跑一轮后发现**范围写大了**——
        # 该目录下只有 webSearch.test.ts 挂（12 条里 1 条，`401 Unauthorized: invalid API key`），
        # 其余 network 用例在 ubuntu 无 key 环境下照常绿。故排除收窄到单文件，
        # 让子集多覆盖回一批真实用例，而不是整目录一刀切。
        #
        # 2026-07-25：runtime/browser/** 的排除已摘除。原因（当初写的"ubuntu 上退化成
        # self-started-chrome"）在 #672 给本 job 补装 Playwright chromium（见上一步）后不再成立——
        # gameArtifactValidator 就是靠那次补装变绿的，且它从未被排除。排除列表越长，
        # "主链路子集"这个名字越名不副实，所以逐条试摘、用真 CI 验，而不是留着好看。
        run: |
          # tests/unit 根目录文件（语音全套等）此前不在任何 PR 门里——#809 曾带着
          # 根目录一条红测绿灯合入（批 X 实撞）。glob 只取根级 *.test.ts，子目录仍由
          # 上面的显式列表覆盖，不重复跑。
          #
          # 2026-08-01 实测更正：**vitest 的位置参数是子串匹配，不是 glob**。上一版这里
          # 写的是加引号的 'tests/unit/*.test.ts'——引号挡住 shell 展开，vitest 拿到的是
          # 带 `*` 的字面量，而 `*` 永远不出现在真实路径里，于是这条门从加进来那天起
          # **匹配 0 个文件**：注释写着"根级已覆盖"，实际 28 个根级文件（语音全套 17 个）
          # 一条都没跑过，#809 那个洞根本没被堵上。同款写法还骗过一次 tests/unit/host/**。
          #
          # 修法：不加引号，让 shell 展开成真实路径列表再交给 vitest。
          # 展开为空时**必须报红**——空转正是上一版的失败模式，静默通过等于门自己失明。
          #
          # tests/unit/web 整目录仍在门外（43 个文件，多数拉 supertest 起服务，没在
          # ubuntu 上验过，不敢一次性拉进来）。但 agentRunControllerBroadcast 是纯类单测、
          # 零平台依赖，且它守的正是「事件到不到得了 renderer」这条反复出事的线
          # （2026-08-01 C3 宿主自起轮次、2026-08-02 取消后 surface 不收敛），显式点名接门。
          #
          # 2026-08-02 第三次复发：**tests/unit/shared 整目录 0 个文件进门**。上一版把
          # 根级 glob 修对之后，注释和施工方都把它读成了"tests/unit 都覆盖了"——但
          # `tests/unit/*.test.ts` 展开只出**直接子级**，而 vitest 的位置参数是子串匹配，
          # 显式列表里又没有 shared 这一项，于是三层深的 tests/unit/shared/** 谁也没接住
          # （实测 37 文件 254 用例，全绿，从没进过门）。#809 的洞第三次换地方复发。
          #
          # 判据别再用"根级 glob 覆盖到了"这类推断——**接门与否要跑一遍门的真实参数、
          # 用精确路径核**（vitest --reporter=json 拿文件清单，endswith 精确比对）。
          ROOT_UNIT_TESTS=(tests/unit/*.test.ts)
          if [ ! -e "${ROOT_UNIT_TESTS[0]}" ]; then
            echo "::error::根级 tests/unit/*.test.ts 展开为空，这条门又空转了——修它，别绕过"
            exit 1
          fi
          echo "根级单测文件 ${#ROOT_UNIT_TESTS[@]} 个进门"
          npx vitest run tests/unit/agent tests/unit/host tests/unit/ipc tests/unit/tools tests/unit/services tests/unit/design tests/unit/shared tests/renderer "${ROOT_UNIT_TESTS[@]}" tests/unit/web/agentRunControllerBroadcast.test.ts --retry=1 \
            --exclude 'tests/unit/tools/modules/network/webSearch.test.ts' \
            --exclude 'tests/unit/agent/goalVerifyGate.test.ts'

      - name: MCP protocol compatibility (unit + integration)
        run: npx vitest run tests/unit/mcp tests/integration/mcp --retry=1

      - name: Knip dead-export ratchet
        # dead exports+types 集合棘轮（基线见 scripts/knip-ratchet-baseline.json）。
        # knip 版本锁在脚本内（npx knip@<pin>），未入 devDependencies；本地实测 ~12s，
        # CI 走 setup-node 的 npm 缓存。独立 step 便于失败归因。
        run: node scripts/knip-ratchet.mjs

      - name: Knip production-reachability ratchet
        # legacy profile 锁 66 存量；strict profile 关闭自动测试/plugin 入口，只拦相对 main
        # 新增且从发行版入口完全走不到的源码。完整历史用于解析真实 merge-base。
        run: node scripts/knip-production-ratchet.mjs

      - name: ESLint error/warning ratchet
        # errors / warnings 双独立基线棘轮；任一超基线即阻塞，清理后只能下调。
        run: node scripts/eslint-ratchet.mjs

      - name: Run swarm smoke suite
        run: npm run test:swarm:smoke -- --retry=1

      - name: Upload smoke failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-smoke-logs-${{ github.run_id }}
          path: |
            coverage/
            **/vitest-report*.json
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Full: merge gate，smoke + Playwright e2e（含 webServer 构建）
  # ---------------------------------------------------------------------------
  full:
    name: Swarm full (smoke + e2e)
    needs: smoke
    # full/e2e 现在 PR 也跑（删掉了原来限定 push/workflow_dispatch 的 if）：merge gate 只在合并后
    # 才跑会造成"PR 绿、main 红"——只在 full 暴露的基建缺陷（如 e2e webServer 的原生模块缺失）在
    # PR 阶段测不到，合进 main 必红（见 #166）。on.pull_request.paths 已把触发限定在 src/** /
    # tests/** 等代码 PR，docs-only PR 不会触发整条 workflow，CI 成本可控；workflow_dispatch 仍可
    # 手动跑。full 仍受 `needs: smoke` 门控——smoke 失败则跳过。
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # 同 smoke job：lockfile 严格 + 单独 patch 缺失的 linux platform binary
        run: |
          npm ci --ignore-scripts
          npm install --no-save --no-package-lock --ignore-scripts @rollup/rollup-linux-x64-gnu

      - name: Verify better-sqlite3 Node-API binding
        # v13 的 linux-x64 N-API 二进制在 npm 包内；文件缺失或真实加载失败都直接终止。
        run: |
          test -f node_modules/better-sqlite3/prebuilds/linux-x64.node
          node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('SELECT 1').get(); db.close()"

      - name: Build node-pty native binding
        # main 的 full job 一直缺这步：npm ci --ignore-scripts 跳过了 node-pty 的 install 脚本，
        # 而 node-pty 1.1.0 只带 darwin / win32 prebuild、不带 linux-x64，e2e webServer 启动时
        # loadNativeModule('pty') 在 build/Release → prebuilds/linux-x64 都找不到 pty.node 直接崩
        # （exit 1），导致每次 push main 的 full job 必红（PR 只跑 smoke 不起 webServer 所以看不出）。
        # 这里现场编译并断言产物存在，让失败暴露在本步而非拖到 webServer 启动。
        run: |
          npm rebuild node-pty --build-from-source
          test -f node_modules/node-pty/build/Release/pty.node

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npm run test:swarm:smoke -- --retry=1

      # e2e 从只跑 swarm-chain 扩到三条（+ design-canvas + workbench-overview）：
      # 手动 spec 没有运行者必然腐烂——design-canvas 那条引用的 testid 和按钮标签在 main 上
      # 早就不存在了，没人知道。三条共用同一次 playwright 调用，webServer 只起一次，
      # 边际成本就是两条 spec 自己跑的那点时间，不再多付一遍构建。
      - name: Run swarm e2e suite
        env:
          CODE_AGENT_E2E: '1'
          CI: '1'
        run: npm run test:swarm:e2e

      - name: Record result (success)
        if: success()
        id: result
        run: echo "status=pass" >> "$GITHUB_OUTPUT"

      - name: Record result (failure)
        if: failure()
        id: result_fail
        run: echo "status=fail" >> "$GITHUB_OUTPUT"

      - name: Upload Playwright trace + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-e2e-trace-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # 不再写回 ci/swarm-health.json：streak 直接从 GitHub Actions API 派生，
  # 用 scripts/ci/swarm-streak.sh 按需查询，避免 [skip ci] commit + 1-commit
  # lag 的 trade-off。详见 docs/decisions/010-swarm-road-to-10.md #1。
