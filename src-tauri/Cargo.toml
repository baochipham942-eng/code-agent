[package]
name = "code-agent-tauri"
version = "0.16.50"
description = "Agent Neo desktop shell"
authors = ["Lin Chen"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "webview-data-url"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ctrlc = "3.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage", "NSWorkspace", "NSWindow", "NSResponder", "NSView", "NSControl", "NSButton"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# T2 Windows 进程收割：Job Object 只读枚举 WebView2 子孙进程（不设
# KILL_ON_JOB_CLOSE，见 main.rs 顶部注释）+ tasklist/netstat 认领核对。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
